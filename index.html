<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hidden Serve Geometry</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      --bg: #111418; --panel: #171b21; --card: #1e232b; --line: #2a313b; --text: #dde2e8; --dim: #8b95a3;
      --ok: #3ccf7a; --bad: #ff5a52; --warn: #ffcc33; --accent: #ff9a1f;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 13px/1.45 system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
    button, select, input { font: inherit; }
    #app { display: grid; grid-template-columns: 1fr 460px; grid-template-rows: auto 1fr; height: 100vh; }
    header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 8px 12px;
      background: var(--panel); border-bottom: 1px solid var(--line); }
    .brand { font-weight: 700; white-space: nowrap; }
    .brand small { color: var(--dim); font-weight: 500; margin-left: 6px; }
    .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
    .seg button { border: 0; border-right: 1px solid var(--line); background: transparent; color: var(--text);
      padding: 5px 11px; font-weight: 600; font-size: 12px; cursor: pointer; }
    .seg button:last-child { border-right: 0; }
    .seg button:hover { background: #ffffff10; }
    .seg button.on { background: var(--accent); color: #15120c; }
    #timeline { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 300px; }
    #timeline input { flex: 1; accent-color: var(--accent); }
    #phase { font: 12px ui-monospace, Menlo, monospace; color: var(--accent); min-width: 118px; }
    .btn { background: #252b34; color: var(--text); border: 1px solid #39414d; border-radius: 6px; padding: 5px 11px;
      font-weight: 600; font-size: 12px; cursor: pointer; }
    .btn:hover { border-color: var(--accent); }
    .btn:disabled { opacity: .5; cursor: progress; }
    .btn.primary, .btn.on { background: var(--accent); border-color: var(--accent); color: #15120c; }
    #lang { min-width: 56px; }
    #view { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
    #view canvas { display: block; }
    #legend { position: absolute; left: 10px; top: 10px; display: flex; flex-wrap: wrap; gap: 4px 12px; max-width: min(660px, 72%);
      padding: 6px 10px; border-radius: 7px; background: #000a; font-size: 11px; pointer-events: none; z-index: 2; }
    #legend span { white-space: nowrap; }
    #legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
    .inset-label { position: absolute; font: 600 11px system-ui, "PingFang SC", sans-serif; color: #fff; background: #000a; padding: 1px 6px; border-radius: 3px; pointer-events: none; }
    #panel { overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line); }
    .verdicts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px 12px 8px; }
    .vcard { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--dim); border-radius: 8px; padding: 8px 10px; }
    .vcard.ok { border-left-color: var(--ok); }
    .vcard.bad { border-left-color: var(--bad); }
    .vcard .k { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; color: var(--dim); text-transform: uppercase; }
    .vcard .v { font-size: 19px; font-weight: 800; margin: 1px 0; }
    .vcard.ok .v { color: var(--ok); }
    .vcard.bad .v { color: var(--bad); }
    .vcard .s { font-size: 11.5px; color: var(--dim); }
    .facts { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 10px; }
    .chip { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; font-size: 11.5px; }
    .chip.warn { border-color: #7a6420; color: var(--warn); }
    .chip.bad { border-color: #7a2d29; color: var(--bad); }
    details { border-top: 1px solid var(--line); }
    summary { cursor: pointer; padding: 7px 12px; font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--dim); text-transform: uppercase; }
    summary:hover { color: var(--text); }
    .sec { padding: 0 12px 10px; font: 12px/1.55 ui-monospace, Menlo, "PingFang SC", monospace; white-space: pre-wrap; font-variant-numeric: tabular-nums; }
    .ok { color: var(--ok); font-weight: 700; } .bad { color: var(--bad); font-weight: 700; } .warn { color: var(--warn); font-weight: 700; } .dim { color: var(--dim); }
    .box { padding: 10px 12px; border-top: 1px solid var(--line); }
    .box h3 { margin: 0 0 8px; font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--dim); text-transform: uppercase; }
    .row { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
    .row + .row { margin-top: 8px; }
    select { background: #252b34; color: var(--text); border: 1px solid #39414d; border-radius: 6px; padding: 3px 6px; font-size: 12px; max-width: 100%; }
    label.opt { color: var(--dim); font-size: 12px; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
    #presets { display: flex; flex-wrap: wrap; gap: 6px; }
    #results:empty { display: none; }
    #results table { border-collapse: collapse; width: 100%; margin: 6px 0 8px; font: 11.5px ui-monospace, Menlo, "PingFang SC", monospace; }
    #results td, #results th { border: 1px solid var(--line); padding: 4px 5px; text-align: center; }
    #results th { color: var(--dim); font-weight: 600; background: #ffffff06; }
    #results td.click { cursor: pointer; }
    #results td.click:hover { outline: 2px solid var(--accent); outline-offset: -2px; }
    #results td.yes { background: #3a1d1d; color: #ffaaa5; }
    #results td.no { background: #16271d; color: #8fe0ad; }
    #results .note { color: var(--dim); font-size: 11px; }
    #results .title { font-weight: 700; }
    .lil-gui.root { --width: 100%; width: 100% !important; --background-color: var(--panel); --widget-color: #2a303a;
      --name-width: 50%; --font-size: 11.5px; --input-font-size: 11.5px; --title-background-color: #1b2028; border-top: 1px solid var(--line); }
    .lbl { font: 600 10px system-ui, "PingFang SC", sans-serif; color: #fff; background: #000b; padding: 0 4px; border-radius: 3px; white-space: nowrap; pointer-events: none; }
    .lbl.free { color: #8ec5ff; } .lbl.racket { color: #8ff0b8; }
    .ballring { width: 30px; height: 30px; border: 2px solid var(--accent); border-radius: 50%; pointer-events: none; }
    .ballring.hidden { border-style: dashed; border-color: var(--bad); }
    dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 0;
      width: min(760px, calc(100vw - 32px)); box-shadow: 0 20px 60px #000c; }
    dialog::backdrop { background: #000b; }
    .dlg { display: grid; gap: 10px; padding: 14px 16px; }
    .dlg h2 { margin: 0; font-size: 15px; }
    .dlg p { margin: 0; font-size: 12px; }
    #json-text { width: 100%; height: min(58vh, 480px); resize: vertical; background: #0c0f13; color: var(--text); border: 1px solid #39414d;
      border-radius: 6px; padding: 8px 10px; font: 12px/1.45 ui-monospace, Menlo, monospace; tab-size: 2; }
    #json-text:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    .dlg-actions { display: flex; align-items: center; gap: 8px; }
    #json-msg { flex: 1; font-size: 12px; min-width: 0; overflow-wrap: anywhere; }
    #json-load:disabled { cursor: not-allowed; }
    @media (max-width: 900px) { #app { grid-template-columns: 1fr; grid-template-rows: auto 60vh auto; } #panel { border-left: 0; } }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <span class="brand"><span id="brand"></span><small>ITTF 2.6.4 / 2.6.5</small></span>
      <div class="seg" id="views">
        <button data-view="3d" class="on"></button><button data-view="receiver"></button><button data-view="overhead"></button><button data-view="side"></button>
      </div>
      <div id="timeline">
        <button class="btn" id="play" aria-label="play">▶</button>
        <span class="dim" id="tl0"></span>
        <input id="t" type="range" min="0" max="1" step="0.005" value="1" list="ticks" />
        <datalist id="ticks"><option value="0"></option><option id="tick-apex" value="0.5"></option><option value="1"></option></datalist>
        <span class="dim" id="tl1"></span>
        <span id="phase"></span>
      </div>
      <button class="btn" id="reset"></button>
      <button class="btn" id="lang"></button>
    </header>
    <main id="view"><div id="legend"></div></main>
    <aside id="panel">
      <div id="verdicts" class="verdicts"></div>
      <div id="facts" class="facts"></div>
      <div id="status"></div>
      <div class="box">
        <h3 id="h-search"></h3>
        <div class="row">
          <button class="btn primary" id="search"></button>
          <button class="btn" id="sweep"></button>
          <button class="btn" id="compare"></button>
        </div>
        <div class="row">
          <label class="opt"><span id="l-scope"></span>
            <select id="scope"><option value="typical"></option><option value="common"></option><option value="extended"></option><option value="family"></option></select></label>
        </div>
        <div class="row">
          <label class="opt"><input id="behind" type="checkbox"><span id="l-behind"></span></label>
          <label class="opt"><input id="whole" type="checkbox"><span id="l-whole"></span></label>
        </div>
      </div>
      <div id="results" class="box"></div>
      <div class="box"><h3 id="h-presets"></h3><div id="presets"></div></div>
      <div class="box"><h3 id="h-pose"></h3><div class="row"><button class="btn" id="copy"></button><button class="btn" id="paste"></button></div></div>
      <div id="gui"></div>
    </aside>
  </div>
  <dialog id="json-dlg" aria-labelledby="json-title">
    <div class="dlg">
      <h2 id="json-title"></h2>
      <p class="dim" id="json-hint"></p>
      <textarea id="json-text" spellcheck="false" autocomplete="off"></textarea>
      <div class="dlg-actions">
        <span id="json-msg" role="status"></span>
        <button class="btn" id="json-copy"></button>
        <button class="btn" id="json-cancel"></button>
        <button class="btn primary" id="json-load"></button>
      </div>
    </div>
  </dialog>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
